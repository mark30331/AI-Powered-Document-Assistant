
services:
  db:
    image: pgvector/pgvector:pg15
    container_name: practice_ai_workflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - practice_ai_workflow_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: practice_ai_workflow_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DJANGO_DEBUG: "true"
    depends_on:
      - db

volumes:
  practice_ai_workflow_data:
